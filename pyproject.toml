[project]
name = "dbt-fabricsparknb"
version = "1.7.7"
description = "The Apache Spark adapter plugin for dbt"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "John Rampono", email = "john.rampono@insight.com"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "dbt-fabricspark @ git+https://github.com/microsoft/dbt-fabricspark.git@7fbc5837701b1350886dbdf461e23aa50a306904",
    "dbt-adapters",
    "dbt-spark",
    "sqlparse>=0.4.2",
    "nbformat==5.10.4",
    "types-PyYAML",
    "types-python-dateutil",
    "msfabricpysdkcore==0.2.8",
    "sqlparams>=3.0.0",
    "azure-identity>=1.13.0",
    "azure-core>=1.26.4",
    "requests==2.31.0",
    "typer>=0.12.3",
    "setuptools>=72.1.0",
    "azure-storage-file-datalake",
    "pip-system-certs",
    "pyodbc",
    "lazy-import>=0.2.2"
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.4.0",
    "pytest-clarity==1.0.1",
    "pytest-sugar==1.0.0",
    "ruff>=0.11.10",
    "vulture>=2.14",
    "nest-asyncio==1.6.0",
    "tox",
    "flake8",
    "mypy",
    "black"
]

docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.15",
    "mkdocs-drawio==1.11.2",
    "mkdocs-macros-plugin==1.3.7",
    "mkdocs-nav-weight==0.2.0",
    "mkdocs-redirects==1.2.2",
    "mkdocs-table-reader-plugin==3.1.0",
    "mkdocs-get-deps==0.2.0",
    "mkdocs-git-revision-date-localized-plugin==1.4.7",
    "mkdocs-minify-plugin==0.8.0",
    "mike==2.1.3"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-timeout>=2.4.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.1.1",
    "pytest-clarity==1.0.1",
    "pytest-sugar==1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dbt", "dbt.*", "dbt_wrapper", "dbt_wrapper.*"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.sql", "*.jinja", "*.jinja2", "*.json", "*.md", "macros/**/*", "include/**/*"]

[project.scripts]
dbt_wrapper = "dbt_wrapper.main:app"

[project.urls]
Homepage = "https://github.com/Insight-Services-APAC/APAC-Capability-DAI-DbtFabricSparkNb"
Documentation = "https://insight-services-apac.github.io/APAC-Capability-DAI-DbtFabricSparkNb/"
Repository = "https://github.com/Insight-Services-APAC/APAC-Capability-DAI-DbtFabricSparkNb"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["E402"]

[tool.ruff]
exclude = [
    "samples",
    "samples_tests",
    "tests",
    "build",
    "dist"
]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short"
]
markers = [
    "unit: marks tests as unit tests",
    "functional: marks tests as functional tests",
    "integration: marks tests as integration tests"
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
exclude = '''
/(
    \.git
  | \.tox
  | \.venv
  | build
  | dist
  | tests
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
